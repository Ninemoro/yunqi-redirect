<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="云起小财" />
  <title>云起小财</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fdfaf4 0%, #f7efe2 100%);
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #4a4034;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 320px;
      background: #ffffff;
      border-radius: 22px;
      padding: 38px 28px 26px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }
    .logo {
      width: 74px; height: 74px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #d4a056;
      color: #fff;
      font-size: 36px;
      line-height: 74px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .desc { font-size: 13px; color: #a89b8a; margin: 0 0 26px; }
    .btn {
      display: block; width: 100%;
      padding: 15px 0;
      border: none; border-radius: 14px;
      background: #d4a056;
      color: #fff;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .hint { font-size: 11px; color: #c4b8a6; margin: 16px 0 0; }
    .addr-box {
      margin-top: 18px;
      padding: 10px 12px;
      background: #faf6ef;
      border-radius: 10px;
      font-size: 11px;
      color: #a89b8a;
      word-break: break-all;
      text-align: left;
    }
    .addr-box b { display: block; margin-bottom: 4px; color: #8d7f6a; }
    .copy-btn {
      margin-top: 6px;
      border: 1px solid #ddd2c0;
      background: #fff;
      color: #7a6c57;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">财</div>
    <h1>云起小财</h1>
    <p class="desc">你的记账小管家</p>
    <button class="btn" id="goBtn">打开应用</button>
    <p class="hint">点击按钮进入应用</p>
    <div class="addr-box">
      <b>直接添加下面的地址到主屏幕，可获得全屏体验（无导航栏）</b>
      <span id="addrText"></span>
      <button class="copy-btn" id="copyBtn">复制地址</button>
    </div>
  </div>
  <script>
    // 目标地址由看门狗脚本自动更新（保持 const TARGET 行不变）
    const TARGET = "https://5b4be0c4.r7.cpolar.cn";
    document.getElementById('goBtn').addEventListener('click', function () {
      window.location.href = TARGET;
    });
    var addrEl = document.getElementById('addrText');
    addrEl.textContent = TARGET;
    document.getElementById('copyBtn').addEventListener('click', function () {
      var text = TARGET;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { alert('地址已复制'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('地址已复制');
      }
    });
  </script>
</body>
</html>
